; =============================================================================
; HappyBot - MT5 Strategy Tester config TEMPLATE
; =============================================================================
; This file is a TEMPLATE. run_backtest_loop.ps1 reads it, substitutes the two
; __PLACEHOLDER__ tokens below, and writes a runtime copy that it hands to
; terminal64.exe via:  terminal64.exe /config:"<runtime.ini>"
;
; DO NOT edit the two __PLACEHOLDER__ tokens by hand - the script fills them:
;   __EXPERT_PATH__  -> expert path relative to MQL5\Experts, WITHOUT the
;                       .ex5 extension (MT5 convention), e.g. "HappyBot".
;   __REPORT_NAME__  -> the BARE report file name (no directory, no extension),
;                       e.g. "round01_20260913".
;
; REPORT= HANDLING (build 6191) - READ THIS
; -----------------------------------------
; Report= is set to a BARE FILENAME (no path, no extension). On modern MT5
; builds (this user is on build 6191) the tester writes the report RELATIVE TO
; THE DATA-FOLDER ROOT when Report= is a bare filename, and commonly IGNORES an
; absolute path (which is why an absolute Report= produced no file at all).
; MT5 typically writes <name>.htm (and may create a companion <name>\ folder for
; the report images), and on some builds writes <name>.html instead. The harness
; therefore searches for BOTH extensions under the data-folder root - see
; run_backtest_loop.ps1 step (e) and SETUP.md section 9.
;
; BUILD-DEPENDENT KEYS - READ THIS
; --------------------------------
; MetaTrader 5 has changed [Tester] key names/semantics across builds. The keys
; most likely to differ on YOUR terminal are marked "(build-dependent)" below.
; If a run behaves unexpectedly (wrong dates, wrong model, forward test running,
; latency applied), cross-check the exact spelling for your build and see
; automation/SETUP.md section 9 ("Exact backtest settings") for how to adjust.
;
; These settings mirror the user's confirmed Fusion Markets Strategy Tester
; config (see SETUP.md section 9). HappyBot.mq5 EA INPUTS ARE NOT SET HERE and
; are NOT changed - in particular the EA's own Trade_Timeframe input stays M5.
; =============================================================================

[Tester]

; Expert Advisor to test. Path is relative to <MT5 data>\MQL5\Experts and, by
; MT5 convention, has NO .ex5 extension. Filled by the script from the compiled
; HappyBot. Example resolved value: HappyBot
Expert=__EXPERT_PATH__

; Instrument. Gold vs USD.
Symbol=XAUUSD

; TESTER chart timeframe = tick/modelling granularity of the test run.
; M1 is used so "Every tick based on real ticks" is reconstructed at the finest
; readily-available bar granularity. This is the TESTER timeframe ONLY and is
; INDEPENDENT of the EA's own Trade_Timeframe input (which stays M5). Running
; the tester on M1 while the EA trades on its M5 logic is intended - see
; SETUP.md section 8 for the full explanation.
Period=M1

; Modelling mode (Model codes):
;   0 = Every tick
;   1 = 1 minute OHLC
;   2 = Open prices only
;   4 = Every tick based on real ticks   <-- selected (best fidelity for gold)
Model=4

; Backtest window. Dates are YYYY.MM.DD. Custom period, no forward test.
; SHORTENED to the last ~1 month for fast iteration while proving the loop.
; Restore the full window (FromDate=2026.03.01) once results are trusted and
; you want a robustness check over the longer sample.
FromDate=2026.08.11
ToDate=2026.09.11

; Forward testing OFF (0 = no forward period).
ForwardMode=0

; Account simulation for the test.
Deposit=1000
Currency=USD
; Leverage 1:500 is written as the ratio's second number.
Leverage=500

; Optimization OFF (0 = single run, not an optimization pass).
Optimization=0

; Headless run: no visual chart window. (0 = off, 1 = on.)
Visual=0

; Execution delay / latency model - "Zero latency, ideal execution".
; (build-dependent) Newer builds use ExecutionMode; some builds use a numeric
; "Delays" key instead. 0 here means the zero-latency / ideal-execution model.
; If your build ignores this, set the delay in the Tester GUI once - it is
; remembered per terminal. See SETUP.md section 9.
ExecutionMode=0

; Report file name. BARE filename (no directory, no extension), filled by the
; script. On build 6191 MT5 writes it (as <name>.htm, sometimes <name>.html)
; relative to the data-folder root; an absolute path is commonly ignored.
Report=__REPORT_NAME__

; Overwrite an existing report of the same name instead of appending a suffix.
ReplaceReport=1

; (build-dependent) Make terminal64.exe EXIT once the test finishes, so the
; automation script can proceed to rename the report and commit. Without this
; the terminal would stay open and the script would wait forever.
ShutdownTerminal=1
